name: CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  offline:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ['3.10', '3.12']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install '.[test]'
      - name: Compile check (all modules, incl. those tests do not import)
        run: |
          python -m compileall -q server.py db.py indexer.py embedder.py config.py \
            chunking.py monitor.py backup.py mcp_server.py pilot_config.py \
            connectors scripts examples/run.py
      - run: ./install.sh --dry-run
      - run: python -m pytest tests -v --junitxml=results.xml
      - name: Require executed tests without skips
        run: |
          python - <<'PY'
          import xml.etree.ElementTree as ET
          suites = list(ET.parse('results.xml').getroot().iter('testsuite'))
          assert sum(int(s.get('tests', 0)) for s in suites) >= 8
          assert sum(int(s.get('skipped', 0)) for s in suites) == 0
          PY
      - name: Installed package bootstraps a fresh DB outside checkout
        run: |
          cd "${{ runner.temp }}"
          MEMSVC_DATA_DIR="${{ runner.temp }}/memsvc-data" \
          MEMSVC_DB="${{ runner.temp }}/memsvc-data/memory.db" \
          python -c "import db; assert db.get_or_create_collection('ci-probe'); print('bootstrap OK')"
