name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Compile check
        run: |
          python -m compileall -q server.py db.py indexer.py embedder.py config.py \
            chunking.py monitor.py backup.py mcp_server.py pilot_config.py \
            connectors scripts

      - name: Unit tests (hermetic)
        env:
          MEMSVC_DB: ${{ runner.temp }}/cam-ci.db
        run: python -m unittest discover -s tests -p "test_*.py" -v
